# One release of several merged changes (decision 80 N5): no impl/review/merge steps. deploy_dev waits
# on every member item with Orca deps; members are item ids, comma-separated. An urgent fix is
# ship-change on its own.
name = "ship-batch"
version = 1
title = "묶음 릴리스: {repo}"

[vars.repo]
required = true

[vars.members]
required = true

[[steps]]
id = "deploy_dev"
title = "dev 배포 {repo} ({members})"
blocks_on_var = "members"
stage = "dev"
done_when = "dev 배포가 구성원 전체의 stage_recorded 로 기록된다(배포 지시는 40자 sha)"

[[steps]]
id = "verify_dev"
title = "dev 확인 {repo}"
needs = [{ step = "deploy_dev", kind = "blocks" }]
done_when = "대상 환경이 지금 돌리는 버전과 비교한 dev 확인 증거가 evidence 에 있다"

[[steps]]
id = "deploy_prod"
title = "prod 배포 {repo}"
needs = [{ step = "verify_dev", kind = "blocks" }, { step = "deploy_dev", kind = "deploys_after" }]
stage = "prod"
gate = "owner"
who = "owner"
why_owner = "prod 반영은 오너만 한다"
done_when = "prod 배포가 stage_recorded 에 기록된다(배포 지시는 40자 sha)"
