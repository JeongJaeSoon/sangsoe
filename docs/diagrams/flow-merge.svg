<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1026" role="img" aria-labelledby="tfm dfm">
<title id="tfm">흐름 3. 머지와 정리</title>
<desc id="dfm">PR 을 만든 워커가 MCP tool 로 land 요청을 하면 공유 코어의 land 판정 함수가 먼저 검증 등급 증거를 확인해 없으면 land_failed(evidence_missing)로 끝내고, 있으면 판정하며 GitHub 에서 저장소 설정을 읽는다. 자동 머지 조건 넷(필수 리뷰와 필수 CI 강제, 최신 main 필수 또는 병합 대기열, 새 push 에 승인 무효, prod·인프라·보안 경로가 아님)이 모두 참이면 gh pr merge --auto 로 머지를 예약하고, 하나라도 거짓이면 예약하지 않고 승인되면 머지를 남긴다. 워커는 어느 쪽이든 머지 대기 보고(merge_ready)를 담은 worker_done 으로 스스로 끝나고, Orca 는 Task 를 completed 로 닫고 터미널을 자동 해제하지만 브리프는 머지 확인까지 그 항목을 막힘(리뷰어)으로 읽는다(결정 175). 예약했으면 사람 승인과 CI 가 찰 때 GitHub 이 머지하고, 승인되면 머지이면 승인이 찰 때 pr-monitor 가 소유 리드를 깨워 리드가 같은 land 요청으로 머지한다. 머지 뒤에는 두 갈래 모두 pr-monitor 가 GitHub 을 읽어 머지 확인(머지 표시와 main 포함)을 하고, 확인되면 pr_merged 를 기록하고(Task 가 아직 열려 있으면 completed 로 닫는다) ✅ 가 되며, 이어 main CI 결과를 기록하고 빨강이면 🚨 와 동결이다. pr_merged 는 REAPER 라운드를 앞당기는 힌트일 뿐이고, REAPER 가 타이머 라운드에서 루트를 읽어 표시한 뒤 후보 가운데 PR 상태와 HEAD 포함으로 끝났음이 확인되고 두 라운드 연속인 카드가 삭제 전 검사(커밋 안 된 변경, 원격에 없는 커밋)를 마치면 worktree rm 을 --force 없이 부르고 브랜치는 --delete-branch 로 지운다. 패널은 코어의 뷰와 Orca 의 Task 를 읽어 완료 표시와 머지됨을 보인다. 오른쪽 열은 단계마다 무엇이 오가고 어느 쪽이 원본인지 적었다.</desc>
