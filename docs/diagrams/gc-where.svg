<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 484" role="img" aria-labelledby="tgc dgc">
<title id="tgc">GC 는 어디서 도는가</title>
<desc id="dgc">Orca plugin 의 worker 타이머가 REAPER 라운드를 돌린다. 라운드는 표시와 정리 두 단계이고, 루트를 Orca CLI 와 gh 에서 읽기만 하며 저장하지 않는다. 소유 기록은 공유 코어 sqlite 의 resource 기록을 읽고 쓴다. 정리 대상이 정해지면 정리하거나 보고한다. pr-monitor, orca-monitor, resource-monitor 는 라운드를 앞당기는 힌트를 넣을 뿐 정리하지 않는다. 별도의 GC 부품은 없고 네 칸, monitor 다섯 개, REAPER, 코어 sqlite 는 그대로다.</desc>
<style>
:root{--halo:#f6f8fb;--bg:#fff;--fg:#1d2330;--mut:#586174;--line:#667085;--scr:#047857;--scrbg:#e7f8f0;--ext:#475467;--extbg:#f2f4f7;--orc:#6d28d9;--orcbg:#f1eaff;--warn:#b42318}
@media (prefers-color-scheme:dark){:root{--halo:#0f131b;--bg:#161b26;--fg:#e6e9ef;--mut:#a3adbf;--line:#98a2b3;--scr:#10b981;--scrbg:#0f2d26;--ext:#98a2b3;--extbg:#242b38;--orc:#a78bfa;--orcbg:#2a1f45;--warn:#fca5a5}}
text{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:13px;fill:var(--fg)}
.t{font-weight:700;font-size:14px}.s{font-size:12px;fill:var(--mut)}.m{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:var(--mut)}
.c{text-anchor:middle}
.l{font-size:12px;fill:var(--fg);paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round}
.w{font-size:12.5px;fill:var(--warn);font-weight:700}
.a{stroke:var(--line);stroke-width:1.6;fill:none;marker-end:url(#h)}
.a.h{stroke-dasharray:6 4}
.a.b{marker-start:url(#h)}
.mk{fill:var(--line)}
.scr rect{fill:var(--scrbg);stroke:var(--scr);stroke-width:1.5}
.st rect{fill:var(--scrbg);stroke:var(--scr);stroke-width:1.5;stroke-dasharray:5 3}
.ext rect{fill:var(--extbg);stroke:var(--ext);stroke-width:1.5}
.orc rect{fill:var(--orcbg);stroke:var(--orc);stroke-width:1.5}
.frame{fill:none;stroke:var(--scr);stroke-width:2}
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect width="100%" height="100%" fill="var(--bg)"/>

<!-- hints: monitors (Orca plugin, second cell) -->
<text class="s" x="250" y="22">힌트만 넣는다: 라운드를 앞당길 뿐 정리하지 않는다 (monitor 5개 중 셋)</text>
<g class="scr"><rect x="250" y="34" width="160" height="52" rx="8"/><text class="t c" x="330" y="56">pr-monitor</text><text class="m c" x="330" y="74">pr_merged · pr_closed</text></g>
<g class="scr"><rect x="420" y="34" width="160" height="52" rx="8"/><text class="t c" x="500" y="56">orca-monitor</text><text class="m c" x="500" y="74">worker_done · worker_dead</text></g>
<g class="scr"><rect x="590" y="34" width="160" height="52" rx="8"/><text class="t c" x="670" y="56">resource-monitor</text><text class="m c" x="670" y="74">pressure_high</text></g>
<path class="a h" d="M330,86 L330,150"/><path class="a h" d="M500,86 L500,150"/><path class="a h" d="M670,86 L670,150"/>
<text class="l c" x="415" y="124">힌트</text>

<!-- timer -> round -> out -->
<g class="scr"><rect x="20" y="190" width="170" height="64" rx="8"/><text class="t c" x="105" y="216">Orca plugin</text><text class="s c" x="105" y="236">worker 타이머 (둘째 칸)</text></g>
<path class="a" d="M190,222 L250,222"/><text class="l c" x="220" y="212">주기</text>

<rect class="frame" x="250" y="150" width="500" height="150" rx="10"/>
<text class="t" x="266" y="172">REAPER 라운드 (단일 실행)</text><text class="s" x="266" y="190">둘째 칸 · 토큰 X · 새 부품이 아니라 이 라운드가 GC 다</text>
<g class="scr"><rect x="266" y="204" width="220" height="84" rx="8"/><text class="t" x="278" y="226">① 표시</text><text class="s" x="278" y="246">루트에 닿는 것은 표시</text><text class="s" x="278" y="264">닿지 않는 것은 후보</text><text class="s" x="278" y="280">모름은 보고만</text></g>
<g class="scr"><rect x="514" y="204" width="220" height="84" rx="8"/><text class="t" x="526" y="226">② 정리</text><text class="s" x="526" y="246">후보 + 끝남 긍정</text><text class="s" x="526" y="264">두 라운드 연속 + 유예</text><text class="s" x="526" y="280">삭제 전 검사 통과</text></g>
<path class="a" d="M486,246 L514,246"/>

<g class="scr"><rect x="800" y="190" width="180" height="64" rx="8"/><text class="t c" x="890" y="212">정리 또는 보고</text><text class="s c" x="890" y="230">worktree rm · Docker id</text><text class="m c" x="890" y="246">reap_done · reap_blocked</text></g>
<path class="a" d="M750,222 L800,222"/>

<!-- roots: read only -->
<path class="a" d="M355,300 L355,370"/><path class="a" d="M545,300 L545,370"/>
<text class="l c" x="450" y="340">루트 읽기 (저장 안 함)</text>
<g class="orc"><rect x="250" y="370" width="210" height="64" rx="8"/><text class="t c" x="355" y="392">Orca CLI (첫째 칸)</text><text class="m c" x="355" y="410">worker-list</text><text class="m c" x="355" y="425">worktree list · worktree ps</text></g>
<g class="ext"><rect x="480" y="370" width="130" height="64" rx="8"/><text class="t c" x="545" y="392">gh</text><text class="s c" x="545" y="410">열린 PR</text><text class="s c" x="545" y="425">머지·닫힘 판정</text></g>

<!-- ownership record -->
<path class="a b" d="M700,300 L700,370"/>
<text class="l" x="712" y="340">소유 기록 읽기 · 쓰기</text>
<g class="st"><rect x="660" y="370" width="320" height="64" rx="8"/><text class="t c" x="820" y="392">공유 코어 sqlite (넷째 칸)</text><text class="m c" x="820" y="410">resource 소유 사슬 · resource_adopted</text><text class="m c" x="820" y="425">reap_candidate · reap_round</text></g>

<text class="w" x="20" y="466">루트를 하나라도 못 읽으면 그 라운드는 정리하지 않는다 (roots_ok = false). 소유자를 모르면 모름으로 보고만 한다.</text>
<text class="w" x="20" y="480">루트: 열린 PR · 세션 · 카드 목록 · 보호 목록(설정) · 메인 체크아웃 (Task 루트 짓지 않음)</text>
</svg>
