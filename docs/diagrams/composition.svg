<!-- joints -->
<rect class="lane nolane" x="14" y="662" width="982" height="68" rx="10"/>
<text class="t" x="26" y="684">칸 사이의 연결점</text>
<text x="26" y="704">공유 코어(sqlite) 와 Orca CLI 둘뿐이다. 두 plugin 사이에는 공식 직접 통신 경로가 없다.</text>
<text class="s" x="26" y="722">일반 스킬은 sangsoe 밖, 별도 저장소의 별도 plugin 이고 어느 칸에도 두지 않는다.</text>
</svg>
