<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" role="img" aria-labelledby="t1 d1">
<title id="t1">네 칸 배치</title>
<desc id="d1">모든 기능은 네 칸 중 정확히 하나에 놓이고 판정은 위에서 아래 순서로 한다. 첫째 칸 Orca CLI 내장 기능은 만들지 않고 그대로 부른다: Orca Task, Orca 게이트, Orca 메시지, Orca 워커와 Dispatch, Auto-close, 카드 표시와 조회, Orca Run, 참조와 검색, 대체 시작 대기, 진단, hook 상태 읽기(agent hooks status), 저장소 archive hook(worktree rm --run-hooks), plugin 켜기. Orca 자동화는 기본은 쓰지 않고 T2 가 실패할 때만 automations --precheck 가 타이머를 대신한다. 둘째 칸 Orca plugin 은 sangsoe 가 배포하며 패널, 상태 표시줄 항목, plugin 저장소, 타이머로 도는 monitor 다섯 개와 타이머 멈춤 감지, REAPER, Orca 이벤트 처리(이벤트 4종은 REAPER 에 주는 힌트와 패널 갱신)를 싣는다. Orca plugin hook 8종은 쓰지 않는다. 셋째 칸 Claude Code plugin 은 Orca plugin 이 못 담는 hook, skill, MCP 서버(tools 와 resources), agents 정의만 싣는다. 넷째 칸 공유 코어는 두 plugin 이 함께 쓰는 TS/Node 코어 라이브러리, sqlite 파일, 셸 호출자 전용 CLI 와 판단 함수(GRAPH, ready 뷰, capacity, decision_open, decision_answer, notify, land 판정 함수, restart_due, recover_plan, 시작 점검, 흐름 틀 펼치기, plugin 승인)를 싣는다. 칸 사이의 연결점은 공유 코어의 sqlite 와 Orca CLI 이고 두 plugin 사이에는 공식 직접 통신 경로가 없다.</desc>
<style>
:root{--halo:#f6f8fb;--bg:#fff;--fg:#1d2330;--mut:#586174;--line:#667085;--scr:#047857;--scrbg:#e7f8f0;--llm:#c2410c;--llmbg:#fff1e6;--ext:#475467;--extbg:#f2f4f7;--own:#1d4ed8;--ownbg:#e8f0ff;--orc:#6d28d9;--orcbg:#f1eaff;--warn:#b42318}
@media (prefers-color-scheme:dark){:root{--halo:#0f131b;--bg:#161b26;--fg:#e6e9ef;--mut:#a3adbf;--line:#98a2b3;--scr:#10b981;--scrbg:#0f2d26;--llm:#f97316;--llmbg:#38200f;--ext:#98a2b3;--extbg:#242b38;--own:#3b82f6;--ownbg:#14233f;--orc:#a78bfa;--orcbg:#2a1f45;--warn:#fca5a5}}
text{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:13px;fill:var(--fg)}
.t{font-weight:700;font-size:14px}.s{font-size:12px;fill:var(--mut)}.m{font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
.big{font-weight:700;font-size:20px}
.lane{fill:var(--bg);stroke:var(--line);stroke-width:1}
.lane.c1{stroke:var(--orc);stroke-width:2}
.lane.c2{stroke:var(--scr);stroke-width:2}
.lane.c3{stroke:var(--llm);stroke-width:2}
.lane.c4{stroke:var(--scr);stroke-width:2;stroke-dasharray:8 4}
.lane.nolane{stroke-dasharray:4 3}
.scr rect{fill:var(--scrbg);stroke:var(--scr);stroke-width:1.5}
.st rect{fill:var(--scrbg);stroke:var(--scr);stroke-width:1.5;stroke-dasharray:5 3}
.llm rect{fill:var(--llmbg);stroke:var(--llm);stroke-width:1.5}
.ext rect{fill:var(--extbg);stroke:var(--ext);stroke-width:1.5}
.orc rect{fill:var(--orcbg);stroke:var(--orc);stroke-width:1.5}
.no rect{fill:var(--bg);stroke:var(--ext);stroke-width:1.5;stroke-dasharray:3 3}
.ar{stroke:var(--line);stroke-width:2;fill:none;marker-end:url(#h)}
.mk{fill:var(--line)}
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>

<text class="s" x="22" y="26">판정 순서: 위에서 아래로. 앞 칸이 할 수 있으면 뒤 칸에 만들지 않는다. 모든 기능은 네 칸 중 정확히 하나에 있다.</text>
<path class="ar" d="M8,40 L8,650"/>

<!-- 1 Orca CLI -->
