<g class="orc"><rect x="215" y="48" width="176" height="34" rx="6"/><text x="225" y="63">Orca Task</text><text class="m" x="225" y="76" style="font-size:10.5px">task-create --deps</text></g>
<g class="orc"><rect x="399" y="48" width="176" height="34" rx="6"/><text x="409" y="63">Orca 게이트</text><text class="m" x="409" y="76" style="font-size:10.5px">gate-create · -resolve</text></g>
<g class="orc"><rect x="583" y="48" width="176" height="34" rx="6"/><text x="593" y="63">Orca 메시지</text><text class="m" x="593" y="76" style="font-size:10.5px">send · ask · reply</text></g>
<g class="orc"><rect x="767" y="48" width="176" height="34" rx="6"/><text x="777" y="63">Orca 워커 · Dispatch</text><text class="m" x="777" y="76" style="font-size:10.5px">worker-start --task</text></g>
<g class="orc"><rect x="215" y="88" width="176" height="34" rx="6"/><text x="225" y="103">Auto-close</text><text class="m" x="225" y="116" style="font-size:10.5px">worker-release</text></g>
<g class="orc"><rect x="399" y="88" width="176" height="34" rx="6"/><text x="409" y="103">카드 표시 · 조회</text><text class="m" x="409" y="116" style="font-size:10.5px">set · ps · list · rm</text></g>
<g class="orc"><rect x="583" y="88" width="176" height="34" rx="6"/><text x="593" y="103">Orca 참조 · 검색</text><text class="m" x="593" y="116" style="font-size:10.5px">reference · search</text></g>
<g class="orc"><rect x="767" y="88" width="176" height="34" rx="6"/><text x="777" y="103">Orca 진단</text><text class="m" x="777" y="116" style="font-size:10.5px">diagnostics memory</text></g>
<g class="orc"><rect x="215" y="128" width="176" height="34" rx="6"/><text x="225" y="143">대체 시작 대기</text><text class="m" x="225" y="156" style="font-size:10.5px">wait --for tui-idle</text></g>
<g class="orc"><rect x="399" y="128" width="176" height="34" rx="6"/><text x="409" y="143">plugin 켜기</text><text class="m" x="409" y="156" style="font-size:10.5px">plugin enable --approve</text></g>
<g class="orc"><rect x="583" y="128" width="176" height="34" rx="6"/><text x="593" y="143">Orca Run</text><text class="m" x="593" y="156" style="font-size:10.5px">run-use · show</text></g>
<g class="orc"><rect x="767" y="128" width="176" height="34" rx="6"/><text x="777" y="143">hook 상태 읽기</text><text class="m" x="777" y="156" style="font-size:10.5px">agent hooks status</text></g>
<g class="orc"><rect x="215" y="168" width="176" height="34" rx="6"/><text x="225" y="183">저장소 archive hook</text><text class="m" x="225" y="196" style="font-size:10.5px">rm --run-hooks (결정 86)</text></g>
<g class="no"><rect x="399" y="168" width="544" height="34" rx="6"/><text x="409" y="183">Orca 자동화: 기본은 쓰지 않음 (에이전트 프롬프트 실행이라)</text><text class="s" x="409" y="197">T2 가 실패할 때만 automations --precheck 가 타이머를 대신한다</text></g>

