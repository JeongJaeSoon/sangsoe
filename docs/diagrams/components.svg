<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" role="img" aria-labelledby="t2 d2">
<title id="t2">컴포넌트와 상호작용</title>
<desc id="d2">외부(Claude Code, Orca, GitHub, 채팅)의 신호를 hook 과 monitor 가 코어 라이브러리의 event 로 쓴다. 보라색은 Orca 가 하는 일이다: 항목의 원본인 Orca Task, 결정을 막고 푸는 Orca 게이트, 에이전트를 깨우는 Orca 메시지, 워커를 시작하고 해제하는 Orca 워커, 그리고 Orca Run, 참조, 검색, 진단, 조회. monitor 는 Orca plugin worker 의 타이머로 돈다. 코어 라이브러리에는 MCP 서버, CLI, plugin worker 의 세 입구, event·뷰·파일, GRAPH, ready 뷰·capacity·decision_open·decision_answer·notify 함수가 있다. 스크립트 역할은 뷰를 읽고 결과 event 를 쓰며 GitHub 와 Orca 에 행동한다. 에이전트는 Orca 메시지로 깨어나 MCP 로 쓴다. 오너는 채팅과 Orca 패널로 말하고 본다.</desc>
<style>
:root{--halo:#f6f8fb;--bg:#fff;--fg:#1d2330;--mut:#586174;--line:#667085;--scr:#047857;--scrbg:#e7f8f0;--llm:#c2410c;--llmbg:#fff1e6;--ext:#475467;--extbg:#f2f4f7;--own:#1d4ed8;--ownbg:#e8f0ff;--orc:#6d28d9;--orcbg:#f1eaff;--warn:#b42318}
@media (prefers-color-scheme:dark){:root{--halo:#0f131b;--bg:#161b26;--fg:#e6e9ef;--mut:#a3adbf;--line:#98a2b3;--scr:#10b981;--scrbg:#0f2d26;--llm:#f97316;--llmbg:#38200f;--ext:#98a2b3;--extbg:#242b38;--own:#3b82f6;--ownbg:#14233f;--orc:#a78bfa;--orcbg:#2a1f45;--warn:#fca5a5}}
text{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:12px;fill:var(--fg)}
.t{font-weight:700;font-size:13px}.s{font-size:12px;fill:var(--mut)}.m{font-family:ui-monospace,Menlo,monospace;font-size:12px}.b{font-weight:700}
.l{font-size:12px;paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round}
.frame{fill:var(--bg);stroke:var(--scr);stroke-width:2;stroke-dasharray:8 4}
.a{stroke:var(--line);stroke-width:1.6;fill:none;marker-end:url(#h)}
.a.w{stroke-dasharray:6 4}.a.d{marker-start:url(#hs)}
.mk{fill:var(--line)}
.scr rect{fill:var(--scrbg);stroke:var(--scr);stroke-width:1.5}
.st rect{fill:var(--scrbg);stroke:var(--scr);stroke-width:1.5;stroke-dasharray:5 3}
.core rect{fill:var(--scrbg);stroke:var(--scr);stroke-width:2.5}
.llm rect{fill:var(--llmbg);stroke:var(--llm);stroke-width:1.5}
.ext rect{fill:var(--extbg);stroke:var(--ext);stroke-width:1.5}
.own rect{fill:var(--ownbg);stroke:var(--own);stroke-width:1.5}
.orc rect{fill:var(--orcbg);stroke:var(--orc);stroke-width:1.5}
</style>
<defs>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="hs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

