<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 740" role="img" aria-labelledby="tfu dfu">
<title id="tfu">흐름 1. 유닛 시작</title>
<desc id="dfu">리드 세션이 MCP 서버의 tool 로 항목 만들기와 시작을 요청하면 MCP 서버가 공유 코어 함수를 부르고, 코어가 Orca CLI 의 task-create 를 부른다. 시작은 두 단계다(결정 202): 코어가 agent 없이 worktree create 로 새 worktree 를 만들고 그 셸의 handle 과 setup 유무를 읽은 뒤, 새 worktree 의 .claude/settings.local.json 에 행의 advisor 를 쓰고, worker-start --task --worktree id:&lt;그것&gt; --keep-open 으로 그 worktree 에서 워커를 연다. Orca 가 새 워커 세션을 띄우면 SessionStart hook 이 sangsoe CLI 로 코어를 부르고 코어가 역할 줄과 브리프 경로를 돌려주어 hook 출력으로 브리프가 주입된다. 워커가 풀린 뒤 REAPER 는 기록이 setup none 일 때만 그 셸 하나를 terminal close 로 닫는다. 오른쪽 열은 단계마다 무엇이 오가고 어느 쪽이 원본인지 적었다.</desc>
<style>
:root{--halo:#f6f8fb;--bg:#fff;--fg:#1d2330;--mut:#586174;--line:#667085;--scr:#047857;--scrbg:#e7f8f0;--llm:#c2410c;--llmbg:#fff1e6;--ext:#475467;--extbg:#f2f4f7;--own:#1d4ed8;--ownbg:#e8f0ff;--orc:#6d28d9;--orcbg:#f1eaff;--warn:#b42318}
@media (prefers-color-scheme:dark){:root{--halo:#0f131b;--bg:#161b26;--fg:#e6e9ef;--mut:#a3adbf;--line:#98a2b3;--scr:#10b981;--scrbg:#0f2d26;--llm:#f97316;--llmbg:#38200f;--ext:#98a2b3;--extbg:#242b38;--own:#3b82f6;--ownbg:#14233f;--orc:#a78bfa;--orcbg:#2a1f45;--warn:#fca5a5}}
text{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:13px;fill:var(--fg)}
.t{font-weight:700;font-size:14px}.s{font-size:12px;fill:var(--mut)}.m{font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
.c{text-anchor:middle}
.l{font-size:12px;fill:var(--fg);paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round}
.ll{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.sec rect{fill:var(--extbg);stroke:none}.sec text{font-weight:700}
.a{stroke:var(--line);stroke-width:1.6;fill:none;marker-end:url(#h)}
.a.w{stroke-dasharray:6 4}
.mk{fill:var(--line)}
.scr rect{fill:var(--scrbg);stroke:var(--scr);stroke-width:1.5}
.st rect{fill:var(--scrbg);stroke:var(--scr);stroke-width:1.5;stroke-dasharray:5 3}
.llm rect{fill:var(--llmbg);stroke:var(--llm);stroke-width:1.5}
.orc rect{fill:var(--orcbg);stroke:var(--orc);stroke-width:1.5}
.num circle{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.num text{font-size:11px;font-weight:700;text-anchor:middle}
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>

<rect width="100%" height="100%" fill="var(--bg)"/>
<!-- lifelines -->
<line class="ll" x1="62" y1="56" x2="62" y2="732"/><line class="ll" x1="192" y1="56" x2="192" y2="732"/><line class="ll" x1="322" y1="56" x2="322" y2="732"/>
<line class="ll" x1="452" y1="56" x2="452" y2="732"/><line class="ll" x1="582" y1="56" x2="582" y2="732"/><line class="ll" x1="712" y1="56" x2="712" y2="732"/>

<!-- actors -->
<g class="llm"><rect x="4" y="8" width="116" height="48" rx="8"/><text class="t c" x="62" y="28">리드 세션</text><text class="s c" x="62" y="46">skill · MCP tool</text></g>
<g class="scr"><rect x="134" y="8" width="116" height="48" rx="8"/><text class="t c" x="192" y="28">MCP 서버</text><text class="s c" x="192" y="46">Claude Code plugin</text></g>
<g class="scr"><rect x="264" y="8" width="116" height="48" rx="8"/><text class="t c" x="322" y="28">공유 코어</text><text class="s c" x="322" y="46">TS/Node · sqlite</text></g>
<g class="orc"><rect x="394" y="8" width="116" height="48" rx="8"/><text class="t c" x="452" y="28">Orca CLI</text><text class="s c" x="452" y="46">내장 기능</text></g>
<g class="llm"><rect x="524" y="8" width="116" height="48" rx="8"/><text class="t c" x="582" y="28">새 워커 세션</text><text class="s c" x="582" y="46">LLM</text></g>
<g class="scr"><rect x="654" y="8" width="116" height="48" rx="8"/><text class="t c" x="712" y="28">hook</text><text class="s c m" x="712" y="46" style="font-size:10.5px">SessionStart</text></g>
<g class="st"><rect x="790" y="8" width="364" height="48" rx="8"/><text class="t" x="802" y="28">오가는 것 · 원본</text><text class="s" x="802" y="46">원본이 있는 쪽을 적는다</text></g>

<!-- A -->
<g class="sec"><rect x="10" y="68" width="1140" height="24" rx="5"/><text x="20" y="85">요청: Claude 세션 → 코어 → Orca CLI</text></g>
<g class="num"><circle cx="24" cy="116" r="9"/><text x="24" y="120">1</text></g>
<path class="a" d="M62,116 L192,116"/><text class="l c" x="127" y="109">MCP tool</text>
<text class="m" x="796" y="120">iNNN · 끝나는 조건 · 의존</text>
<g class="num"><circle cx="24" cy="160" r="9"/><text x="24" y="164">2</text></g>
<path class="a" d="M192,160 L322,160"/><text class="l c" x="257" y="153">코어 함수 호출</text>
<text class="m" x="796" y="164">어댑터는 상태가 없다</text>
<g class="num"><circle cx="24" cy="204" r="9"/><text x="24" y="208">3</text></g>
<path class="a" d="M322,204 L452,204"/><text class="l c" x="387" y="197">task-create --deps</text>
<text class="m" x="796" y="199">원본: Orca Task</text><text class="m" x="796" y="213">sangsoe: item_extra_set</text>

<!-- B -->
<g class="sec"><rect x="10" y="228" width="1140" height="24" rx="5"/><text x="20" y="245">worktree: 먼저 만들고, advisor 설정을 쓰고, 그 안에서 연다 (결정 202)</text></g>
<g class="num"><circle cx="24" cy="276" r="9"/><text x="24" y="280">4</text></g>
<path class="a" d="M322,276 L452,276"/><text class="l c" x="387" y="269">worktree create</text>
<text class="m" x="796" y="271">agent 없이 · --parent-worktree id: · --setup run</text><text class="m" x="796" y="285">열린 셸 handle · setup none/script/unknown</text>
<g class="num"><circle cx="24" cy="324" r="9"/><text x="24" y="328">5</text></g>
<path class="a" d="M322,312 L364,312 L364,336 L326,336"/><text class="l" x="372" y="329">설정 파일 쓰기</text>
<text class="m" x="796" y="319">새 worktree 의 .claude/settings.local.json</text><text class="m" x="796" y="333">행의 advisor (route worktree_file)</text>
<g class="num"><circle cx="24" cy="372" r="9"/><text x="24" y="376">6</text></g>
<path class="a" d="M322,372 L452,372"/><text class="l c" x="387" y="365">worker-start --task</text>
<text class="m" x="796" y="367">--worktree id:&lt;그것&gt; --keep-open</text><text class="m" x="796" y="381">sqlite: unit_started{shell, setup}</text>

<!-- C -->
<g class="sec"><rect x="10" y="396" width="1140" height="24" rx="5"/><text x="20" y="413">시작: Orca 가 새 세션을 띄우고 SessionStart hook 이 브리프를 건넨다</text></g>
<g class="num"><circle cx="24" cy="444" r="9"/><text x="24" y="448">7</text></g>
<path class="a" d="M452,444 L582,444"/><text class="l c" x="517" y="437">세션 시작 + Dispatch</text>
<text class="m" x="796" y="439">원본: Orca 워커 · Dispatch</text><text class="m" x="796" y="453">sangsoe 는 id 만 참조</text>
<g class="num"><circle cx="24" cy="492" r="9"/><text x="24" y="496">8</text></g>
<path class="a" d="M582,492 L712,492"/><text class="l c" x="647" y="485">SessionStart</text>
<text class="m" x="796" y="496">Claude Code 가 hook 을 부른다</text>
<g class="num"><circle cx="24" cy="540" r="9"/><text x="24" y="544">9</text></g>
<path class="a" d="M712,540 L322,540"/><text class="l c" x="517" y="533">command hook → sangsoe CLI (시작 점검 · run-use)</text>
<text class="m" x="796" y="535">sqlite: session_started</text><text class="m" x="796" y="549">세션 id 를 같이 쓴다</text>
<g class="num"><circle cx="24" cy="588" r="9"/><text x="24" y="592">10</text></g>
<path class="a" d="M322,588 L712,588"/><text class="l c" x="517" y="581">역할 줄 · 브리프 경로를 표준 출력으로</text>
<text class="m" x="796" y="583">원본: 브리프 파일 · 일의 종류</text><text class="m" x="796" y="597">없으면 시작 거부</text>
<g class="num"><circle cx="24" cy="636" r="9"/><text x="24" y="640">11</text></g>
<path class="a" d="M712,636 L582,636"/><text class="l c" x="647" y="629">hook 출력 = 컨텍스트</text>
<text class="m" x="796" y="640">워커가 브리프를 읽고 일한다</text>

<!-- D -->
<g class="sec"><rect x="10" y="660" width="1140" height="24" rx="5"/><text x="20" y="677">끝: 워커가 풀린 뒤 REAPER 가 기록한 셸 하나만 닫는다</text></g>
<g class="num"><circle cx="24" cy="708" r="9"/><text x="24" y="712">12</text></g>
<path class="a w" d="M322,708 L452,708"/><text class="l c" x="387" y="701">terminal close</text>
<text class="m" x="796" y="703">setup: none · Dispatch 모두 released</text><text class="m" x="796" y="717">그 밖이면 닫지 않고 오너가 닫는다</text>
</svg>
