name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each job has a time limit (decision 266): GitHub's default is 360 minutes, and these end in under two.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The declared minimum (package.json engines), so an API newer than it fails here.
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      # `shell: bash` runs with pipefail, so a failing test still fails the step through tee.
      - name: npm test
        shell: bash
        env:
          # The names this public tree must not carry are a repository secret, never written here
          # (decision 267). A fork's PR gets no secrets: the check then skips and the summary says so.
          SANGSOE_HYGIENE_PATTERN: ${{ secrets.SANGSOE_HYGIENE_PATTERN }}
        run: npm test 2>&1 | tee "$RUNNER_TEMP/test-output.log"
      # Skipped tests and a rerun attempt go to the job summary, also when a test failed.
      - name: Skipped tests and reruns
        if: ${{ !cancelled() }}
        run: node scripts/ci-test-summary.ts "$RUNNER_TEMP/test-output.log"
      - run: npm run build
      - name: sangsoe --version from the build
        run: |
          out="$(node dist/cli/main.js --version)"
          echo "$out"
          test "$out" = "sangsoe $(node -p 'require("./package.json").version')"
