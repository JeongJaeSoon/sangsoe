name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag must equal v + package.json version
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match package.json version $version"
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Pack the tree
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          npm pack --pack-destination out
          mv "out/sangsoe-$VERSION.tgz" "out/sangsoe-$VERSION.tar.gz"
          tar -tzf "out/sangsoe-$VERSION.tar.gz"
          (cd out && sha256sum "sangsoe-$VERSION.tar.gz" > "sangsoe-$VERSION.tar.gz.sha256")
          cat "out/sangsoe-$VERSION.tar.gz.sha256"

      - name: Smoke-test the packed tree
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir smoke
          tar -xzf "out/sangsoe-$VERSION.tar.gz" -C smoke
          out="$(SANGSOE_ROOT="$PWD/smoke/package" node smoke/package/dist/cli/main.js --version)"
          test "$out" = "sangsoe $VERSION"
          SANGSOE_ROOT="$PWD/smoke/package" node smoke/package/dist/cli/main.js doctor --offline

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --title "sangsoe $VERSION" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create -R "$GITHUB_REPOSITORY" "$TAG" "out/sangsoe-$VERSION.tar.gz" "out/sangsoe-$VERSION.tar.gz.sha256" "${flags[@]}"
